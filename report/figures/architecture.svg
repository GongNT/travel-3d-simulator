<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #0c8599; stroke-width: 2; }
    .box-llm { fill: #fff7e6; stroke: #f4a300; stroke-width: 2.5; }
    .box-det { fill: #eefbf3; stroke: #2d6a4f; stroke-width: 2.5; }
    .title { fill: #1f2d27; font-size: 15px; font-weight: 700; }
    .sub { fill: #4a5d55; font-size: 11px; }
    .tag { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .arrow { stroke: #0b4f6c; stroke-width: 2.5; marker-end: url(#arrowhead); fill: none; }
    .lane-label { fill: #0b4f6c; font-size: 14px; font-weight: 700; }
    .bg { fill: #fdf6e6; }
  </style>
  <rect class="bg" x="0" y="0" width="1300" height="620" />
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0b4f6c" />
    </marker>
  </defs>

  <text class="lane-label" x="30" y="40">Lane 1 — Decision Engine (per session)</text>

  <!-- Lane 1 boxes -->
  <rect class="box" x="30" y="60" width="200" height="90" rx="10" />
  <text class="title" x="130" y="90" text-anchor="middle">Free-text</text>
  <text class="title" x="130" y="108" text-anchor="middle">preferences</text>
  <text class="sub" x="130" y="130" text-anchor="middle">"5 hrs, mid budget,</text>
  <text class="sub" x="130" y="143" text-anchor="middle">relaxing + food"</text>

  <rect class="box-llm" x="280" y="60" width="220" height="90" rx="10" />
  <rect x="280" y="60" width="70" height="22" rx="10" fill="#f4a300" />
  <text class="tag" x="315" y="75" text-anchor="middle">LLM</text>
  <text class="title" x="390" y="105" text-anchor="middle">parsePreferences()</text>
  <text class="sub" x="390" y="125" text-anchor="middle">gpt-5.6-luna, JSON mode</text>
  <text class="sub" x="390" y="140" text-anchor="middle">-&gt; budget/time/category weights</text>

  <rect class="box-det" x="550" y="60" width="220" height="90" rx="10" />
  <rect x="550" y="60" width="150" height="22" rx="10" fill="#2d6a4f" />
  <text class="tag" x="625" y="75" text-anchor="middle">DETERMINISTIC</text>
  <text class="title" x="660" y="105" text-anchor="middle">scoreSpots()</text>
  <text class="sub" x="660" y="125" text-anchor="middle">weighted multi-criteria</text>
  <text class="sub" x="660" y="140" text-anchor="middle">match + cost fit + time fit</text>

  <rect class="box" x="820" y="60" width="220" height="90" rx="10" />
  <text class="title" x="930" y="90" text-anchor="middle">Ranked results</text>
  <text class="sub" x="930" y="112" text-anchor="middle">score + why-it-won</text>
  <text class="sub" x="930" y="127" text-anchor="middle">explanation, per spot</text>

  <line class="arrow" x1="230" y1="105" x2="278" y2="105" />
  <line class="arrow" x1="500" y1="105" x2="548" y2="105" />
  <line class="arrow" x1="770" y1="105" x2="818" y2="105" />

  <line x1="30" y1="175" x2="1270" y2="175" stroke="#e7d9b8" stroke-width="2" />

  <text class="lane-label" x="30" y="220">Lane 2 — Review-Driven 3D Walk (on "Walk around X")</text>

  <rect class="box" x="30" y="240" width="200" height="90" rx="10" />
  <text class="title" x="130" y="270" text-anchor="middle">Curated reviews</text>
  <text class="sub" x="130" y="292" text-anchor="middle">4 authored reviews</text>
  <text class="sub" x="130" y="305" text-anchor="middle">per spot (spots.js)</text>

  <rect class="box-llm" x="280" y="240" width="220" height="90" rx="10" />
  <rect x="280" y="240" width="70" height="22" rx="10" fill="#f4a300" />
  <text class="tag" x="315" y="255" text-anchor="middle">LLM</text>
  <text class="title" x="390" y="285" text-anchor="middle">extractAmbiance()</text>
  <text class="sub" x="390" y="305" text-anchor="middle">ground/sky/palette/props</text>
  <text class="sub" x="390" y="320" text-anchor="middle">picked from a fixed catalog</text>

  <rect class="box-det" x="550" y="240" width="220" height="90" rx="10" />
  <rect x="550" y="240" width="150" height="22" rx="10" fill="#2d6a4f" />
  <text class="tag" x="625" y="255" text-anchor="middle">DETERMINISTIC</text>
  <text class="title" x="660" y="285" text-anchor="middle">layoutPositions()</text>
  <text class="sub" x="660" y="305" text-anchor="middle">seeded PRNG (spot id)</text>
  <text class="sub" x="660" y="320" text-anchor="middle">scatter / path / radial / perimeter</text>

  <rect class="box" x="820" y="240" width="220" height="90" rx="10" />
  <text class="title" x="930" y="270" text-anchor="middle">Three.js scene</text>
  <text class="sub" x="930" y="292" text-anchor="middle">React Three Fiber</text>
  <text class="sub" x="930" y="305" text-anchor="middle">low-poly prop catalog</text>

  <rect class="box" x="1060" y="240" width="210" height="90" rx="10" />
  <text class="title" x="1165" y="270" text-anchor="middle">Walk controller</text>
  <text class="sub" x="1165" y="292" text-anchor="middle">WASD + mouse-look</text>
  <text class="sub" x="1165" y="305" text-anchor="middle">Pointer Lock API</text>

  <line class="arrow" x1="230" y1="285" x2="278" y2="285" />
  <line class="arrow" x1="500" y1="285" x2="548" y2="285" />
  <line class="arrow" x1="770" y1="285" x2="818" y2="285" />
  <line class="arrow" x1="1040" y1="285" x2="1058" y2="285" />

  <line x1="30" y1="355" x2="1270" y2="355" stroke="#e7d9b8" stroke-width="2" />

  <text class="lane-label" x="30" y="400">Data &amp; runtime</text>
  <rect class="box" x="30" y="420" width="330" height="80" rx="10" />
  <text class="title" x="195" y="450" text-anchor="middle">Fully client-side (Vite + React)</text>
  <text class="sub" x="195" y="470" text-anchor="middle">No backend/database in this demo -</text>
  <text class="sub" x="195" y="485" text-anchor="middle">API key + fetch() straight to OpenAI</text>

  <rect class="box" x="390" y="420" width="330" height="80" rx="10" />
  <text class="title" x="555" y="450" text-anchor="middle">Curated demo dataset</text>
  <text class="sub" x="555" y="470" text-anchor="middle">5 hand-authored spots in Nice, France</text>
  <text class="sub" x="555" y="485" text-anchor="middle">(src/data/spots.js) - no live API/scraping</text>

  <rect class="box" x="750" y="420" width="330" height="80" rx="10" />
  <text class="title" x="915" y="450" text-anchor="middle">Fixed prop/enum catalogs</text>
  <text class="sub" x="915" y="470" text-anchor="middle">Constrains the LLM to valid geometry/</text>
  <text class="sub" x="915" y="485" text-anchor="middle">layout choices - no free-form 3D coords</text>

  <rect x="30" y="540" width="18" height="18" fill="#fff7e6" stroke="#f4a300" stroke-width="2" />
  <text class="sub" x="55" y="554">LLM call (gpt-5.6-luna)</text>
  <rect x="230" y="540" width="18" height="18" fill="#eefbf3" stroke="#2d6a4f" stroke-width="2" />
  <text class="sub" x="255" y="554">Deterministic code (no LLM)</text>
  <rect x="470" y="540" width="18" height="18" fill="#ffffff" stroke="#0c8599" stroke-width="2" />
  <text class="sub" x="495" y="554">Data / UI</text>
</svg>
